[pytest]
pythonpath = .vendor
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --alluredir=reports/allure-results --clean-alluredir --reruns 2 --reruns-delay 1
markers =
    smoke: 冒烟测试(5 分钟内可跑完, 验证服务可用性)
    regression: 回归测试(业务功能完整覆盖)
    database: 数据库断言测试
    api: 接口功能测试
    rbac: 权限矩阵测试(不同角色调用同一接口的差异化期望)
    concurrent: 并发与幂等性测试
