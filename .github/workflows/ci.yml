name: Auto Test CI

# Two-stage CI pipeline:
#   1. static-check  : always runs on push/PR, fast, no GVA needed
#                      validates YAML, imports and pytest collection
#   2. integration    : manual or scheduled, needs a reachable GVA service
#                      (staging URL via GVA_BASE_URL secret or self-hosted runner)
# GVA has no official prebuilt Docker image, so SUT is deployed separately
# (see .github/docker-compose.ci.yml for a self-contained build-from-source option)
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   GVA_BASE_URL   e.g. http://10.0.0.1:8888 (point at reachable GVA)
#   DB_PASSWORD    root password of the GVA MySQL instance
#   DB_DATABASE    (optional, default: gva)
#   ADMIN_USERNAME (optional, default: admin)
#   ADMIN_PASSWORD (optional, default: 123456)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      gva_base_url:
        description: 'GVA base URL for integration tests (e.g. http://10.0.0.1:8888)'
        required: false
        default: ''
      db_password:
        description: 'GVA MySQL root password (optional, defaults to Secret or 123456)'
        required: false
        default: ''

env:
  PYTHONPATH: .vendor
  TEST_ENV: ci

jobs:
  static-check:
    name: Static Check & Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies to .vendor
        run: |
          python -m pip install --upgrade pip
          pip install --target .vendor -r requirements.txt

      - name: Validate YAML configs
        run: |
          python -c "import yaml; yaml.safe_load(open('config/environments/ci.yaml', encoding='utf-8')); print('ci.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('config/environments/go_vue_admin.yaml', encoding='utf-8')); print('go_vue_admin.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('data/test_data.yaml', encoding='utf-8')); print('test_data.yaml OK')"

      - name: Pytest collection (no execution, validates imports/fixtures)
        run: pytest --collect-only -q

      - name: Compile all Python files (syntax check)
        run: python -m compileall -q api config db utils testcases

  integration:
    name: Integration Tests (needs GVA)
    runs-on: ubuntu-latest
    # Integration needs a reachable GVA, only run on manual/schedule
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # MySQL services container: healthcheck must use literal strings
    # (GitHub Actions does not allow ${{ secrets.* }} substitution inside services.options
    #  and services.env; hard-coded defaults match .env.example defaults.)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: gva
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies to .vendor
        run: |
          python -m pip install --upgrade pip
          pip install --target .vendor -r requirements.txt

      - name: Resolve environment variables (input > secret > default)
        run: |
          # Bash fallback chain: workflow input -> Secret -> built-in default
          GVA_BASE_URL="${{ github.event.inputs.gva_base_url }}"
          GVA_BASE_URL="${GVA_BASE_URL:-${{ secrets.GVA_BASE_URL }}}"
          GVA_BASE_URL="${GVA_BASE_URL:-http://127.0.0.1:8888}"
          echo "GVA_BASE_URL=$GVA_BASE_URL" >> $GITHUB_ENV

          DB_PASSWORD="${{ github.event.inputs.db_password }}"
          DB_PASSWORD="${DB_PASSWORD:-${{ secrets.DB_PASSWORD }}}"
          DB_PASSWORD="${DB_PASSWORD:-123456}"
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

          DB_DATABASE="${{ secrets.DB_DATABASE }}"
          DB_DATABASE="${DB_DATABASE:-gva}"
          echo "DB_DATABASE=$DB_DATABASE" >> $GITHUB_ENV

          ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
          ADMIN_USERNAME="${ADMIN_USERNAME:-admin}"
          echo "ADMIN_USERNAME=$ADMIN_USERNAME" >> $GITHUB_ENV

          ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
          ADMIN_PASSWORD="${ADMIN_PASSWORD:-123456}"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> $GITHUB_ENV

          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_USER=root" >> $GITHUB_ENV

      - name: Show resolved config (secrets masked)
        run: |
          echo "GVA_BASE_URL=$GVA_BASE_URL"
          echo "DB_HOST=$DB_HOST DB_DATABASE=$DB_DATABASE DB_USER=$DB_USER"
          python -c "from config.settings import settings; print('base_url=', settings.base_url)"

      - name: Probe GVA reachability (skip gracefully if GVA is down)
        run: |
          echo "Probing GVA at $GVA_BASE_URL ..."
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "$GVA_BASE_URL/swagger/index.html" -o /dev/null; then
              echo "GVA is reachable"
              exit 0
            fi
            echo "Waiting for GVA... ($i/30)"
            sleep 5
          done
          echo "::warning::GVA not reachable at $GVA_BASE_URL, skipping integration tests"
          echo "GVA_REACHABLE=false" >> $GITHUB_ENV

      - name: Run tests
        if: env.GVA_REACHABLE != 'false'
        run: pytest -v --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always() && env.GVA_REACHABLE != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn
