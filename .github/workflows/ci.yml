name: Auto Test CI

# Two-stage CI pipeline:
#   1. static-check  : always runs on push/PR, fast, no GVA needed
#   2. integration   : manual or scheduled, builds GVA from source in CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      gva_base_url:
        description: 'Override GVA base URL (leave empty to use CI-built GVA)'
        required: false
        default: ''

env:
  PYTHONPATH: .vendor
  TEST_ENV: ci

jobs:
  static-check:
    name: Static Check & Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies to .vendor
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target .vendor -r requirements.txt

      - name: Validate YAML configs
        run: |
          python -c "import yaml; yaml.safe_load(open('config/environments/ci.yaml', encoding='utf-8')); print('ci.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('config/environments/go_vue_admin.yaml', encoding='utf-8')); print('go_vue_admin.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('data/test_data.yaml', encoding='utf-8')); print('test_data.yaml OK')"

      - name: Pytest collection (no execution, validates imports/fixtures)
        run: python -m pytest --collect-only -q

      - name: Compile all Python files (syntax check)
        run: python -m compileall -q api config db utils testcases

  integration:
    name: Integration Tests (GVA built from source)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies to .vendor
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target .vendor -r requirements.txt

      #  构建 GVA 服务栈

      - name: Clone GVA source code
        run: |
          git clone --depth 1 https://github.com/flipped-aurora/gin-vue-admin.git gva-source
          ls -la gva-source/server/

      - name: Start GVA stack with Docker Compose
        run: |
          docker compose -f .github/docker-compose.ci.yml up -d --wait
          docker compose -f .github/docker-compose.ci.yml ps

      - name: Wait for GVA to be ready
        run: |
          echo "Waiting for GVA server to be ready..."
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 "http://127.0.0.1:8888/swagger/index.html" -o /dev/null; then
              echo "GVA is ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "GVA failed to start"
          docker compose -f .github/docker-compose.ci.yml logs gva-server
          exit 1

      #  配置测试环境

      - name: Set up environment variables
        run: |
          GVA_BASE_URL="${{ github.event.inputs.gva_base_url }}"
          if [ -z "$GVA_BASE_URL" ]; then
            GVA_BASE_URL="http://127.0.0.1:8888"
          fi
          echo "GVA_BASE_URL=$GVA_BASE_URL" >> $GITHUB_ENV

          echo "DB_PASSWORD=123456" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_USER=root" >> $GITHUB_ENV
          echo "DB_DATABASE=gva" >> $GITHUB_ENV
          echo "ADMIN_USERNAME=admin" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=123456" >> $GITHUB_ENV

      - name: Show resolved config
        run: |
          echo "GVA_BASE_URL=$GVA_BASE_URL"
          echo "DB_HOST=$DB_HOST DB_DATABASE=$DB_DATABASE DB_USER=$DB_USER"
          python -c "from config.settings import settings; print('base_url=', settings.base_url)"

      #  运行测试

      - name: Run integration tests
        run: python -m pytest -v --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn

      - name: Show GVA logs (if tests failed)
        if: failure()
        run: |
          echo "=== GVA Server Logs ==="
          docker compose -f .github/docker-compose.ci.yml logs gva-server --tail=50
          echo "=== MySQL Logs ==="
          docker compose -f .github/docker-compose.ci.yml logs mysql --tail=20
          echo "=== Redis Logs ==="
          docker compose -f .github/docker-compose.ci.yml logs redis --tail=20