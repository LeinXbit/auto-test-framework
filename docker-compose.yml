services:
  # MySQL 测试数据库
  mysql:
    image: mysql:8.0
    container_name: test-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # 自动化测试服务
  auto-test:
    build: .
    container_name: auto-test-framework
    depends_on:
      mysql:
        condition: service_healthy  # 等 MySQL 健康后再启动
    environment:
      - TEST_ENV=test
      # 覆盖数据库配置, 指向 Docker 内部网络
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      # 把容器里的报告目录映射到本地, 方便查看
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - test-network

networks:
  test-network:
    driver: bridge