# GVA 用户注册场景数据驱动用例
# 说明:
#   1. GVA 统一响应 {"code":0|非0,"data":..,"msg":".."}, HTTP 状态码恒为 200,
#      故 expected_http 恒为 200, 不再使用旧的 201/409/400(那是 mock 时代残留, 已废弃).
#   2. GVA 失败业务码实测多为 7(如重复注册, 必填项缺失, 类型不匹配), 成功为 0.
#   3. 所有期望值已通过探针脚本对真实 GVA 接口验证, 不再有 "待探针确认" 项.
#   4. 模板变量:
#      ${random}        - 运行时替换为唯一后缀, 避免脏数据
#      ${existing_user} - 运行时由用例预注册一个用户, 再用同名注册触发重复
#   5. 数据隔离: 注册成功的用户由用例 teardown 通过 DB 兜底清理(关联表 + 主表).

register_cases:
  - case_id: "REG_001"
    case_name: "正常注册"
    username: "auto_${random}"
    password: "Test1234!"
    nick_name: "auto_user"
    authority_id: 888
    expected_http: 200
    expected_code: 0
    expected_msg_contains: "成功"
    description: "合法参数注册, 期望成功并返回 data.user(含 ID)"

  - case_id: "REG_002"
    case_name: "用户名重复"
    username: "${existing_user}"
    password: "Test1234!"
    authority_id: 888
    expected_http: 200
    expected_code: 7
    expected_msg_contains: "失败"
    description: "用户名已存在, 期望 code=7 且 msg 含'失败'"

  - case_id: "REG_003"
    case_name: "authorityId 传字符串(类型越界)"
    username: "auto_${random}"
    password: "Test1234!"
    authority_id: "888"
    expected_http: 200
    expected_code: 7
    expected_msg_contains: "unmarshal"
    description: "GVA 后端 authorityId 字段为 uint, 传字符串触发 json unmarshal 错误"

  - case_id: "REG_004"
    case_name: "密码为空"
    username: "auto_${random}"
    password: ""
    authority_id: 888
    expected_http: 200
    expected_code: 7
    expected_msg_contains: "Password"
    description: "必填项缺失, GVA 返回 code=7, msg=Password值不能为空"

  - case_id: "REG_005"
    case_name: "用户名为空"
    username: ""
    password: "Test1234!"
    authority_id: 888
    expected_http: 200
    expected_code: 7
    expected_msg_contains: "Username"
    description: "必填项缺失, GVA 返回 code=7, msg=Username值不能为空"
